---
- name: Setup AWS CloudWatch OAM Sink in Central Monitoring Account
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aws_region: "us-east-1"
    sink_name: "CentralDiskMonitoringSink"
    # List all Source Workload Account IDs here
    source_account_ids:
      - "222222222222"
      - "333333333333"

  tasks:
    - name: Create CloudWatch OAM Sink
      amazon.aws.aws_cli:
        command: "oam create-sink --name {{ sink_name }} --region {{ aws_region }}"
      register: oam_sink_result

    - name: Parse Sink ARN
      ansible.builtin.set_fact:
        sink_arn: "{{ (oam_sink_result.stdout | from_json).Arn }}"

    - name: Display Created Sink ARN
      ansible.builtin.debug:
        msg: "Central OAM Sink created successfully: {{ sink_arn }}"

    - name: Render Sink Policy from Template
      ansible.builtin.template:
        src: "../templates/sink_policy.json.j2"
        dest: "/tmp/rendered_sink_policy.json"
        mode: "0644"

    - name: Attach Access Policy to OAM Sink
      amazon.aws.aws_cli:
        command: >
          oam put-sink-policy
          --sink-identifier {{ sink_arn }}
          --policy file:///tmp/rendered_sink_policy.json
          --region {{ aws_region }}
      register: policy_result

    - name: Confirm Policy Attached
      ansible.builtin.debug:
        msg: "Sink policy attached successfully."