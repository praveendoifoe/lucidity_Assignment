schemaVersion: '0.3'
description: 'Automate 20% EBS volume expansion and in-guest filesystem resize via SSM.'
assumeRole: '{{ AutomationAssumeRole }}'
parameters:
  InstanceId:
    type: String
    description: 'EC2 Instance ID requiring disk expansion.'
  VolumeId:
    type: String
    description: 'EBS Volume ID attached to the EC2 instance.'
  AutomationAssumeRole:
    type: String
    description: 'IAM Role ARN allowing SSM to inspect and modify EBS volumes.'

mainSteps:
  - name: CalculateAndModifyVolume
    action: 'aws:executeScript'
    description: 'Get current EBS volume size, add 20%, and issue ec2:ModifyVolume.'
    inputs:
      Runtime: python3.9
      Handler: script_handler
      Script: |
        import boto3
        import math

        def script_handler(event, context):
            ec2 = boto3.client('ec2')
            volume_id = event['VolumeId']
            
            # Describe current volume to fetch size
            response = ec2.describe_volumes(VolumeIds=[volume_id])
            current_size = response['Volumes'][0]['Size']
            
            # Calculate 20% increase (rounded up to nearest GB)
            new_size = math.ceil(current_size * 1.20)
            
            # Ensure at least 1 GB increment if current size is small
            if new_size == current_size:
                new_size += 1
                
            print(f"Current volume size: {current_size} GB. Expanding by 20% to: {new_size} GB.")
            
            # Modify volume size
            ec2.modify_volume(VolumeId=volume_id, Size=new_size)
            
            return {
                'VolumeId': volume_id,
                'OldSize': current_size,
                'NewSize': new_size
            }
      InputPayload:
        VolumeId: '{{ VolumeId }}'
    outputs:
      - Name: NewSize
        Selector: '$.Payload.NewSize'
        Type: Integer

  - name: WaitForVolumeModification
    action: 'aws:waitForAwsResourceProperty'
    description: 'Wait for EBS volume state to reach modifying/optimizing/completed.'
    inputs:
      service: ec2
      api: DescribeVolumesModifications
      VolumeIds:
        - '{{ VolumeId }}'
      PropertySelector: '$.VolumesModifications[0].ModificationState'
      DesiredValues:
        - 'modifying'
        - 'optimizing'
        - 'completed'

  - name: ExpandOSFilesystem
    action: 'aws:runCommand'
    description: 'Run in-guest commands via SSM Agent to grow partition and filesystem.'
    inputs:
      DocumentName: AWS-RunShellScript
      InstanceIds:
        - '{{ InstanceId }}'
      Parameters:
        commands:
          - |
            #!/bin/bash
            set -e
            echo "=== Detecting Root Device & Partition ==="
            ROOT_DEV=$(lsblk -no PKNAME $(findmnt -n -o SOURCE /) 2>/dev/null || echo "nvme0n1")
            PART_NUM=$(findmnt -n -o SOURCE / | grep -o '[0-9]*$')

            echo "=== Growing Partition ==="
            if command -v growpart &> /dev/null; then
                growpart /dev/${ROOT_DEV} ${PART_NUM} || true
            fi

            echo "=== Resizing Filesystem ==="
            FSTYPE=$(findmnt -n -o FSTYPE /)
            if [ "$FSTYPE" == "xfs" ]; then
                xfs_growfs /
            elif [ "$FSTYPE" == "ext4" ] || [ "$FSTYPE" == "ext3" ]; then
                resize2fs /dev/${ROOT_DEV}p${PART_NUM} 2>/dev/null || resize2fs /dev/${ROOT_DEV}${PART_NUM}
            fi
            echo "=== Filesystem resize completed successfully ==="